name: Notify docs dummy deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation dummy
        uses: actions/checkout@v4

      - name: Dispatch deployment event to docs-dummy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_DUMMY_DISPATCH_TOKEN }}
          repository: Encryption-Consulting-LLC/docs-dummy
          event-type: documentation_updated
          client-payload: >-
            {
              "source_repository": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref_name }}"
            }
